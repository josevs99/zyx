global:
  scrape_interval: 5s

scrape_configs:

  - job_name: 'zyx-api'

    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets:
          - app:8080

  - job_name: 'cockroachdb'

    metrics_path: '/_status/vars'

    static_configs:
      - targets:
          - cockroach:8080

  - job_name: 'node-exporter'

    static_configs:
      - targets:
          - node-exporter:9100
